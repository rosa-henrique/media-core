apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-core
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /backoffice(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: proxy
                port:
                  number: 3002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-core-assets
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: proxy
                port:
                  number: 3002
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: proxy
                port:
                  number: 3002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-core-proxy-assets
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /_next
            pathType: Prefix
            backend:
              service:
                name: proxy
                port:
                  number: 3002
