version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - echo "=== DIRETORIO ATUAL ==="
            - pwd
            - echo "=== CONTEUDO ATUAL ==="
            - ls -la
            - echo "=== DIRETORIO PAI ==="
            - ls -la ..
            - echo "=== LOCALIZACAO DO WORKSPACE ==="
            - find . -maxdepth 4 -name pnpm-workspace.yaml
            - echo "=== VERSOES ==="
            - node --version
            - pnpm --version
      artifacts:
        baseDirectory: frontend/apps/web/.next
        files:
          - '**/*'