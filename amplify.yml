version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@12.15.0
            - pnpm --version
            - cd "$PWD/frontend" && pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm exec turbo run build --filter=web...
            - echo "=== NEXT NA RAIZ DO WORKSPACE ==="
            - ls -la frontend/node_modules/next
            - echo "=== NEXT NA APLICACAO ==="
            - ls -la frontend/apps/web/node_modules/next
            - echo "=== NEXT NO STANDALONE ==="
            - ls -la frontend/apps/web/.next/standalone/node_modules/next
            - echo "=== CONFIGURACAO PNPM ==="
            - cd frontend && pnpm config get node-linker
      artifacts:
        baseDirectory: frontend/apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - frontend/node_modules/**/*
          - frontend/apps/web/.next/cache/**/*
