version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - echo "PWD:"
            - pwd
            - echo "CODEBUILD_SRC_DIR:"
            - echo "$CODEBUILD_SRC_DIR"
            - echo "Conteudo da raiz:"
            - ls -la
            - echo "Localizacao do workspace:"
            - find . -maxdepth 4 -name pnpm-workspace.yaml
            - echo "Instalando pnpm:"
            - npm install -g pnpm@12.15.0
            - pnpm --version
      artifacts:
        baseDirectory: frontend/apps/web/.next
        files:
          - "**/*"
