version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@12.15.0
            - pnpm --version
            - cd "$CODEBUILD_SRC_DIR/frontend" && pnpm install --frozen-lockfile
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR/frontend" && pnpm exec turbo run build --filter=web...
      artifacts:
        baseDirectory: frontend/apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - frontend/node_modules/**/*
          - frontend/apps/web/.next/cache/**/*