version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@12.15.0
            - pnpm --version
            - cd "$PWD/frontend" && pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm exec turbo run build --filter=web...
            - echo "=== DIRETORIO ATUAL ==="
            - pwd
            - echo "=== NEXT NA RAIZ DO WORKSPACE ==="
            - test -d node_modules/next && echo "EXISTE" || echo "NAO EXISTE"
            - echo "=== NEXT NA APLICACAO ==="
            - test -d apps/web/node_modules/next && echo "EXISTE" || echo "NAO EXISTE"
            - echo "=== NEXT NO STANDALONE ==="
            - test -d apps/web/.next/standalone/node_modules/next && echo "EXISTE" || echo "NAO EXISTE"
            - echo "=== PACOTE NEXT NO WORKSPACE ==="
            - pnpm why next --filter web
            - echo "=== NODE LINKER ==="
            - pnpm config get node-linker
            - echo "=== DIRETORIO ANTES DO BUILD ==="
            - pwd
            - echo "=== ARQUIVOS ==="
            - ls -la
      artifacts:
        baseDirectory: frontend/apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - frontend/node_modules/**/*
          - frontend/apps/web/.next/cache/**/*
